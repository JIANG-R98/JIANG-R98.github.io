<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>江畔小记</title>
  <meta name="description" content="网站施工中，不用期待">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #fff;
      color: #000;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 1.5rem;
    }

    .notice {
      position: relative;
      padding: clamp(1.1rem, 3vw, 1.4rem) clamp(1.5rem, 5vw, 2.2rem);
      background: #fff;
    }

    /* 边框分两组描出：上下先展开，左右再合拢 */
    .notice::before,
    .notice::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .notice::before {
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
      animation: frame-x 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) 0.12s both;
    }

    .notice::after {
      border-left: 1px solid #000;
      border-right: 1px solid #000;
      animation: frame-y 0.42s cubic-bezier(0.22, 0.61, 0.36, 1) 0.5s both;
    }

    .copy {
      margin: 0;
      font-size: clamp(0.8rem, 2.6vw, 0.95rem);
      letter-spacing: 0.06em;
      line-height: 1.6;
      white-space: nowrap;
      animation: copy-in 0.5s ease-out 0.7s both;
    }

    @keyframes frame-x {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    @keyframes frame-y {
      from {
        transform: scaleY(0);
      }
      to {
        transform: scaleY(1);
      }
    }

    @keyframes copy-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      padding: 0 1rem 1.25rem;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.8;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .filings {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.25rem 1rem;
    }

    .filing-mps {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .filing-mps img {
      width: 16px;
      height: 17px;
    }

    a:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 0.25rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .notice::before,
      .notice::after {
        animation: none;
        transform: none;
      }

      .copy {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="notice">
      <p class="copy">🚧 网站施工中，不用期待</p>
    </div>
  </main>

  <footer>
    <div class="filings">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备2026077071号</a>
      <a class="filing-mps" href="https://beian.mps.gov.cn/#/query/webSearch?code=11010502064063" target="_blank" rel="noopener noreferrer"><img src="beian.png" alt="公安备案图标">京公网安备11010502064063号</a>
    </div>
  </footer>
</body>
</html>
