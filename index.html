<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jiang</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #fff;
      color: #000;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 2rem;
    }

    h1 {
      margin: 0;
      font: inherit;
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    footer {
      padding: 0 1rem 1.25rem;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.6;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jiang</h1>
  </main>

  <footer>
    <!-- 备案通过后，把占位文本替换为真实备案号。 -->
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">京ICP备XXXXXXXX号-1</a>
  </footer>
</body>
</html>
