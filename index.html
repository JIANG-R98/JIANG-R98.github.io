<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>江畔小记</title>
  <meta name="description" content="Jiang 的个人主页：写代码，也记录生活。">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #fff;
      color: #000;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 3rem 1.5rem;
    }

    .profile {
      width: min(100%, 26rem);
      text-align: center;
    }

    /* h1 固定为 5 个字符宽，让整词始终居中，只让内部文字逐字露出。 */
    h1 {
      width: 5ch;
      margin: 0 auto 1rem;
      font: inherit;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 400;
      line-height: 1.2;
      text-align: left;
    }

    /* 打字机：宽度按 5 步增长，右边框当光标，打完闪两下后淡出。 */
    .type {
      display: block;
      box-sizing: content-box;
      width: 0;
      overflow: hidden;
      white-space: nowrap;
      border-right: 0.09em solid transparent;
      animation:
        typing 0.75s steps(5, end) 0.2s forwards,
        caret-blink 0.9s step-end 2 0.2s,
        caret-off 0.35s linear 2s forwards;
    }

    @keyframes typing {
      to { width: 5ch; }
    }

    @keyframes caret-blink {
      0%,
      100% {
        border-right-color: currentColor;
      }

      50% {
        border-right-color: transparent;
      }
    }

    @keyframes caret-off {
      to { border-right-color: transparent; }
    }

    @media (prefers-reduced-motion: reduce) {
      .type {
        width: 5ch;
        border-right-color: transparent;
        animation: none;
      }
    }

    .bio {
      margin: 0 0 1.75rem;
      font-size: 0.875rem;
      line-height: 1.9;
    }

    .bio:last-child {
      margin-bottom: 0;
    }

    /* 社交入口恢复时使用。 */
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.5rem;
      font-size: 0.8125rem;
    }

    .links a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.25em;
    }

    .links a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 0.25rem;
    }

    footer {
      padding: 0 1rem 1.25rem;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.8;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="profile">
      <h1><span class="type">Jiang</span></h1>
      <p class="bio">Jiang，写代码，也记录生活。<br>这里是我的个人主页。</p>

      <!--
        社交入口恢复时，把下面这段放回简介下方，并替换成自己的地址：

        <nav class="links" aria-label="社交账号">
          <a href="https://example.com" target="_blank" rel="noopener noreferrer">示例</a>
        </nav>
      -->
    </div>
  </main>

  <footer>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备2026077071号</a>
  </footer>
</body>
</html>
