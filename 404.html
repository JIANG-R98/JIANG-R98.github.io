<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面未找到 · Jiang</title>
  <meta name="description" content="你访问的页面不存在。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f3ec" id="theme-color">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('jiang-site-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="Jiang 的个人主页">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span class="brand-name">Jiang</span>
      </a>
      <a class="text-link" href="/">回到首页</a>
    </div>
  </header>

  <main class="shell error-page" id="main">
    <p class="error-code" aria-hidden="true">404</p>
    <h1 class="error-title">这个页面走丢了。</h1>
    <p class="error-copy">你访问的地址不存在，或者已经被移动。</p>
    <a class="button button--solid" href="/">
      回到首页
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"></path>
      </svg>
    </a>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>© <span id="year">2026</span> Jiang. 保留所有权利。</p>
      <div class="footer-links">
        <a href="https://github.com/JIANG-R98" target="_blank" rel="noopener">GitHub</a>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">京ICP备XXXXXXXX号-1</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
